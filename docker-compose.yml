services:
  postgres:
    image: postgres:16-alpine
    container_name: woi-postgres
    environment:
      POSTGRES_DB: working_on_it
      POSTGRES_USER: woi
      POSTGRES_PASSWORD: woi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
